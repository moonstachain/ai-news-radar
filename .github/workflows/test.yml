name: Test

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/test.yml"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "business.html"
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile business evidence collector
        run: python -m py_compile scripts/update_business_evidence.py

      - name: Run test suite
        run: python -m pytest -q
